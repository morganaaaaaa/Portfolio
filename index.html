<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio of Roblox development, music and digital art.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="notice" id="notice" hidden></div>

<div class="wrap">
  <header class="top">
    <a class="mark" href="#top"><i></i><span id="site-name"></span></a>
    <nav aria-label="Sections">
      <a href="#work">Work</a>
      <a href="#skills">Skills</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <div class="hero">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="headline"></h1>
      <p class="lede" id="lede"></p>
      <div class="cta">
        <a class="btn primary" href="#contact">Get in touch</a>
      </div>
    </div>

    <div class="stats" id="stats" aria-label="Highlights"></div>

    <div class="work" id="work">
      <div class="tabs" id="tabs" role="tablist" aria-label="Choose what to view"></div>
      <div id="sections"></div>
    </div>

    <section id="skills">
      <div class="sec-head"><h2>Skills and tools</h2></div>
      <div class="skills" id="skills-list"></div>
    </section>

    <section id="about">
      <div class="sec-head"><h2>About</h2></div>
      <div class="about">
        <div class="commissions" id="commissions"></div>
        <div id="about-text"></div>
      </div>
    </section>

    <section id="contact">
      <div class="sec-head"><h2>Contact</h2></div>
      <div class="contact-list" id="contact-list"></div>
    </section>
  </main>

  <footer>
    <span id="footer-left"></span>
    <span id="footer-right"></span>
  </footer>
</div>

<dialog id="lightbox" aria-label="Artwork">
  <img id="lightbox-img" alt="">
  <div class="lightbox-bar">
    <span id="lightbox-caption"></span>
    <button type="button" id="lightbox-close">Close</button>
  </div>
</dialog>

<script src="app.js?v=3"></script>
</body>
</html>
